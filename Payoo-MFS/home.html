<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payoo Home</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <main class="flex justify-center items-center min-h-screen">
        <div class="mockup-phone">
            <div class="mockup-phone-camera"></div>
            <div class="mockup-phone-display flex flex-col justify-center items-center bg-white p-4">
                <!-- Available Balance -->
                <div>
                    <div class="stats shadow">
                        <div class="stat text-center">
                            <div id="acc-balance" class="stat-value">8940</div>
                            <div class="stat-desc">Available balance</div>
                        </div>
                    </div>
                </div>
                <div class="divider"></div>
                <!-- user action button -->
                <div class="flex flex-col gap-1">
                    <button id="main-addmoney-btn" class="btn btn-lg">Add Money</button>
                    <button id="main-cashout-btn" class="btn btn-lg">Cash Out</button>
                    <button id="main-transaction-btn" class="btn btn-lg">transaction</button>
                </div>
                <div class="divider"></div>
                <!-- add money form start -->
                <fieldset id="add-money-form" class=" fieldset bg-base-200 border-base-300 rounded-box w-xs border shadow-2xl p-12">
                    <label class="label font-bold text-black">Amount</label>
                    <input id="amount-input" type="text" autocomplete="off" class="input px-2"
                        placeholder="Enter your Amount" />

                    <label class="label font-bold text-black">Pin</label>
                    <input id="pin-number" type="password" maxlength="4" class="input px-2"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="add-money-btn" class="btn bg-[#0874F2] text-white mt-4">Add Money</button>
                </fieldset>
                <!-- add money form end -->
                <!-- cash out start  -->
                <fieldset id="cash-out-form" class="hidden fieldset bg-base-200 border-base-300 rounded-box w-xs border shadow-2xl p-12">
                    <label class="label font-bold text-black">cash Out Amount</label>
                    <input id="cashout-amount-input" type="text" autocomplete="off" class="input px-2"
                        placeholder="Enter your Amount" />

                    <label class="label font-bold text-black">Pin</label>
                    <input id="cashout-pin-number" type="password" maxlength="4" class="input px-2"
                        placeholder="Enter 4 Digit Pin" />
                    <button id="cash-out-btn" class="btn bg-[#0874F2] text-white mt-4">Cash Out</button>
                </fieldset>
                <!-- cash out end  -->

                <!-- transaction start -->
                 <div id="Transaction-form" class="hidden text-center">
                    <h2 class="text-center text-2xl font-bold">Transaction History</h2>
                    <div id="transaction-container" class="text-center">

                    </div>
                 </div>
                <!-- transaction end -->
            </div>
        </div>
        </div>
    </main>

    <script src="js/utilities2.js"></script>
    <script src="js/addmoney2.js"></script>
    <script src="js/cashout2.js"></script>
    <script src="js/features.js"></script>
</body>

</html>
