<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>payoo MFS</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<main class="flex justify-center items-center min-h-screen">
    <div class="mockup-phone">
        <div class="mockup-phone-camera"></div>
        <div class="mockup-phone-display text-black grid place-content-center bg-white">
            <div class="stats shadow-lg text-center">
                <div class="stat">
                    <div class="stat-value">800</div>
                    <div class="stat-desc">Available Balance</div>
                </div>
            </div>
            <div class="divider"></div>
            <!-- add money start -->
            <div class="hero bg-base-200">
                <div class="hero-content">
                    <div class="card bg-base-100 w-[350px] shadow-2xl">
                        <div class="card-body">
                            <fieldset class="fieldset">
                                <label class="font-bold label">Email</label>
                                <input type="email" class="input" placeholder="Enter Your Mobile" />
                                <label class="label font-bold">PIN</label>
                                <input type="password" class="input" placeholder="Enter You PIN" />
                                <div><a class="link link-hover">Forgot password?</a></div>
                                <button class="btn bg-[#0874F2] text-white mt-4">
                                    Login
                                </button>
                            </fieldset>
                        </div>
                    </div>
                </div>
            </div>
            <!-- add money end -->
        </div>
    </div>
</main>

<body>

</body>

</html>
